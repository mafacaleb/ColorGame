<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Círculos de Colores Multilingüe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: #cbd5e1;
            --subtext-color: #64748b;
            --default-title: #334155;
            --ctrl-bg: #ffffff;
            --ctrl-text: #1e293b;
            --ctrl-border: #cbd5e1;
            --shadow-color: rgba(0, 0, 0, 0.08);
        }

        body.dark-theme {
            --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(15, 23, 42, 0.95);
            --card-border: #334155;
            --subtext-color: #94a3b8;
            --default-title: #f1f5f9;
            --ctrl-bg: #1e293b;
            --ctrl-text: #f8fafc;
            --ctrl-border: #475569;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .color-circle {
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3), inset 0 -5px 10px rgba(0, 0, 0, 0.2), inset 0 5px 10px rgba(255, 255, 255, 0.3);
        }

        .color-circle:active {
            transform: scale(0.92);
            filter: brightness(0.9);
        }

        .display-card {
            background: var(--card-bg);
            border-color: var(--card-border);
            box-shadow: 0 15px 30px var(--shadow-color);
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .ctrl-element {
            background-color: var(--ctrl-bg);
            color: var(--ctrl-text);
            border-color: var(--ctrl-border);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="p-3 sm:p-5">

    <div class="w-full max-w-2xl flex justify-between items-center z-20 mb-1 sm:mb-2">
        <!-- Language Selector -->
        <div class="flex items-center space-x-2">
            <span class="text-sm font-bold uppercase tracking-wider text-slate-400 hidden sm:inline">🌐</span>
            <select id="langSelect" onchange="changeLanguage(this.value)" 
                    class="ctrl-element border font-bold text-xs sm:text-sm rounded-xl px-3 py-2 shadow-md focus:outline-none cursor-pointer">
                <option value="es">🇲🇽 / 🇪🇸 Español</option>
                <option value="en">🇺🇸 / 🇬🇧 English</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="ko">🇰🇷 한국어</option>
            </select>
        </div>

        <!-- Theme Toggle -->
        <button id="themeBtn" onclick="toggleTheme()" 
                class="ctrl-element border font-bold text-xs sm:text-sm rounded-xl px-3 py-2 shadow-md flex items-center space-x-1.5 cursor-pointer">
            <span id="themeIcon">🌙</span>
            <span id="themeText">Oscuro</span>
        </button>
    </div>

    <header class="w-full max-w-xl text-center py-1 sm:py-2">
        <div id="displayCard" class="display-card backdrop-blur-md border-2 rounded-2xl py-3 px-6">
            <span id="subtitleText" class="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-slate-400 block mb-0.5">
                Color Seleccionado
            </span>
            <h1 id="colorName" class="text-2xl sm:text-4xl font-black tracking-wide" style="color: var(--default-title);">
                ¡Toca un color!
            </h1>
        </div>
    </header>

    <main class="w-full max-w-2xl flex-grow flex items-center justify-center my-auto">
        <div class="grid grid-cols-3 gap-3 sm:gap-5 w-full justify-items-center items-center px-1">
            
            <!-- Red / Rojo / Rot / 빨간색 -->
            <div onclick="selectColor('rojo')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-red-600 via-red-500 to-rose-400 flex items-center justify-center">
                <span id="label-rojo" class="text-white font-black text-xs sm:text-base drop-shadow-md">Rojo</span>
            </div>

            <!-- Blue / Azul / Blau / 파란색 -->
            <div onclick="selectColor('azul')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-blue-600 via-blue-500 to-sky-400 flex items-center justify-center">
                <span id="label-azul" class="text-white font-black text-xs sm:text-base drop-shadow-md">Azul</span>
            </div>

            <!-- Green / Verde / Grün / 초록색 -->
            <div onclick="selectColor('verde')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-green-600 via-green-500 to-emerald-300 flex items-center justify-center">
                <span id="label-verde" class="text-white font-black text-xs sm:text-base drop-shadow-md">Verde</span>
            </div>

            <!-- Yellow / Amarillo / Gelb / 노란색 -->
            <div onclick="selectColor('amarillo')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-yellow-500 via-yellow-400 to-amber-200 flex items-center justify-center">
                <span id="label-amarillo" class="text-slate-900 font-black text-xs sm:text-base drop-shadow-sm">Amarillo</span>
            </div>

            <!-- Orange / Naranja / Orange / 주황색 -->
            <div onclick="selectColor('naranja')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-orange-600 via-orange-500 to-amber-300 flex items-center justify-center">
                <span id="label-naranja" class="text-white font-black text-xs sm:text-base drop-shadow-md">Naranja</span>
            </div>

            <!-- Pink / Rosa / Rosa / 분홍색 -->
            <div onclick="selectColor('rosa')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-pink-600 via-pink-500 to-rose-300 flex items-center justify-center">
                <span id="label-rosa" class="text-white font-black text-xs sm:text-base drop-shadow-md">Rosa</span>
            </div>

            <!-- Black / Negro / Schwarz / 검은색 -->
            <div onclick="selectColor('negro')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-black via-slate-900 to-slate-800 border-2 border-slate-700 flex items-center justify-center">
                <span id="label-negro" class="text-white font-black text-xs sm:text-base drop-shadow-md">Negro</span>
            </div>

            <!-- White / Blanco / Weiß / 하얀색 -->
            <div onclick="selectColor('blanco')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-slate-200 via-white to-slate-100 border border-slate-300 flex items-center justify-center">
                <span id="label-blanco" class="text-slate-900 font-black text-xs sm:text-base drop-shadow-sm">Blanco</span>
            </div>

            <!-- Purple / Morado / Lila / 보라색 -->
            <div onclick="selectColor('morado')" 
                 class="color-circle w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-purple-700 via-purple-600 to-fuchsia-400 flex items-center justify-center">
                <span id="label-morado" class="text-white font-black text-xs sm:text-base drop-shadow-md">Morado</span>
            </div>

        </div>
    </main>

    <footer class="text-center text-slate-400 text-[11px] pb-1">
        <p id="footerText">Audio .mp3 instantáneo • Bloqueo de Zoom táctil</p>
    </footer>

    <script>
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
            if (e.scale !== 1 && e.scale !== undefined) {
                e.preventDefault();
            }
        }, { passive: false });

        const colorData = {
            rojo: {
                colorHex: '#ef4444',
                es: { name: 'Rojo', audio: 'rojo.mp3' },
                en: { name: 'Red', audio: 'red.mp3' },
                de: { name: 'Rot', audio: 'rot.mp3' },
                ko: { name: '빨간색', audio: 'red_ko.mp3' }
            },
            azul: {
                colorHex: '#3b82f6',
                es: { name: 'Azul', audio: 'azul.mp3' },
                en: { name: 'Blue', audio: 'blue.mp3' },
                de: { name: 'Blau', audio: 'blau.mp3' },
                ko: { name: '파란색', audio: 'blue_ko.mp3' }
            },
            verde: {
                colorHex: '#22c55e',
                es: { name: 'Verde', audio: 'verde.mp3' },
                en: { name: 'Green', audio: 'green.mp3' },
                de: { name: 'Grün', audio: 'gruen.mp3' },
                ko: { name: '초록색', audio: 'green_ko.mp3' }
            },
            amarillo: {
                colorHex: '#eab308',
                es: { name: 'Amarillo', audio: 'amarillo.mp3' },
                en: { name: 'Yellow', audio: 'yellow.mp3' },
                de: { name: 'Gelb', audio: 'gelb.mp3' },
                ko: { name: '노란색', audio: 'yellow_ko.mp3' }
            },
            naranja: {
                colorHex: '#f97316',
                es: { name: 'Naranja', audio: 'naranja.mp3' },
                en: { name: 'Orange', audio: 'orange.mp3' },
                de: { name: 'Orange', audio: 'orange_de.mp3' },
                ko: { name: '주황색', audio: 'orange_ko.mp3' }
            },
            rosa: {
                colorHex: '#ec4899',
                es: { name: 'Rosa', audio: 'rosa.mp3' },
                en: { name: 'Pink', audio: 'pink.mp3' },
                de: { name: 'Rosa', audio: 'rosa_de.mp3' },
                ko: { name: '분홍색', audio: 'pink_ko.mp3' }
            },
            negro: {
                colorKey: 'negro',
                es: { name: 'Negro', audio: 'negro.mp3' },
                en: { name: 'Black', audio: 'black.mp3' },
                de: { name: 'Schwarz', audio: 'schwarz.mp3' },
                ko: { name: '검은색', audio: 'black_ko.mp3' }
            },
            blanco: {
                colorKey: 'blanco',
                es: { name: 'Blanco', audio: 'blanco.mp3' },
                en: { name: 'White', audio: 'white.mp3' },
                de: { name: 'Weiß', audio: 'weiss.mp3' },
                ko: { name: '힌색', audio: 'white_ko.mp3' }
            },
            morado: {
                colorHex: '#a855f7',
                es: { name: 'Morado', audio: 'morado.mp3' },
                en: { name: 'Purple', audio: 'purple.mp3' },
                de: { name: 'Lila', audio: 'lila.mp3' },
                ko: { name: '보라색', audio: 'purple_ko.mp3' }
            }
        };

        const uiTranslations = {
            es: {
                titleDefault: '¡Toca un color!',
                subtitle: 'Color Seleccionado',
                footer: 'Audio .mp3 instantáneo • Bloqueo de Zoom táctil',
                themeLight: 'Claro',
                themeDark: 'Oscuro'
            },
            en: {
                titleDefault: 'Tap a color!',
                subtitle: 'Selected Color',
                footer: 'Instant .mp3 audio • Touch zoom locked',
                themeLight: 'Light',
                themeDark: 'Dark'
            },
            de: {
                titleDefault: 'Tippe eine Farbe an!',
                subtitle: 'Ausgewählte Farbe',
                footer: 'Sofortige .mp3 Audio • Zoom-Sperre',
                themeLight: 'Hell',
                themeDark: 'Dunkel'
            },
            ko: {
                titleDefault: '색상을 터치하세요!',
                subtitle: '선택한 색상',
                footer: '즉시 .mp3 오디오 재생 • 터치 줌 잠금',
                themeLight: '밝게',
                themeDark: '어둡게'
            }
        };

        let currentLang = 'es';
        let isDarkMode = false;
        let selectedColorKey = null;
        let audioActual = null;

        function changeLanguage(newLang) {
            currentLang = newLang;

            // Update labels inside circles
            Object.keys(colorData).forEach(key => {
                const labelElem = document.getElementById(`label-${key}`);
                if (labelElem) {
                    labelElem.textContent = colorData[key][currentLang].name;
                }
            });

            // Update general UI headers/footers
            const subElem = document.getElementById('subtitleText');
            const footerElem = document.getElementById('footerText');
            subElem.textContent = uiTranslations[currentLang].subtitle;
            footerElem.textContent = uiTranslations[currentLang].footer;

            // Update current color title if selected, or display default prompt
            if (selectedColorKey) {
                selectColor(selectedColorKey, false);
            } else {
                document.getElementById('colorName').textContent = uiTranslations[currentLang].titleDefault;
            }

            updateThemeButtonText();
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-theme', isDarkMode);

            const themeIcon = document.getElementById('themeIcon');
            themeIcon.textContent = isDarkMode ? '☀️' : '🌙';
            updateThemeButtonText();

            if (selectedColorKey === 'negro' || selectedColorKey === 'blanco') {
                updateTextColor(selectedColorKey);
            }
        }

        function updateThemeButtonText() {
            const themeText = document.getElementById('themeText');
            themeText.textContent = isDarkMode ? uiTranslations[currentLang].themeLight : uiTranslations[currentLang].themeDark;
        }

        function selectColor(colorKey, shouldPlayAudio = true) {
            selectedColorKey = colorKey;
            const data = colorData[colorKey];
            const langData = data[currentLang];

            const nameElement = document.getElementById('colorName');
            const cardElement = document.getElementById('displayCard');

            // Audio playback
            if (shouldPlayAudio) {
                if (audioActual) {
                    audioActual.pause();
                    audioActual.currentTime = 0;
                }

                try {
                    audioActual = new Audio(langData.audio);
                    audioActual.preload = 'auto';
                    let playPromise = audioActual.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(err => console.log("Audio load deferred:", err));
                    }
                } catch (e) {
                    console.log("Audio playback error:", e);
                }
            }

            // Pop animation reset
            cardElement.classList.remove('animate-pop');
            void cardElement.offsetWidth;
            cardElement.classList.add('animate-pop');

            // Apply name and contrast color
            nameElement.textContent = langData.name;
            updateTextColor(colorKey);
        }

        function updateTextColor(colorKey) {
            const nameElement = document.getElementById('colorName');
            const data = colorData[colorKey];

            if (colorKey === 'negro') {
                nameElement.style.color = isDarkMode ? '#ffffff' : '#0f172a';
            } else if (colorKey === 'blanco') {
                nameElement.style.color = isDarkMode ? '#f8fafc' : '#334155';
            } else {
                nameElement.style.color = data.colorHex;
            }
        }
    </script>
</body>
</html>
